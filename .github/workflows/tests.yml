name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mat-spec-stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify MAT-SPEC-001 without project dependencies
        run: python -m unittest discover -s tests -p 'test_mat_spec*.py' -v
      - name: Build frozen MAT-SPEC-001
        run: python scripts/build_mat_spec.py --out dist/mat-spec-001
      - name: Print frozen MAT-SPEC-001 baseline digests for successor pinning
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          for path in sorted(Path("dist/mat-spec-001").iterdir()):
              if path.is_file():
                  print("MAT_SPEC_PARENT_DIGEST", path.name, hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Build successor MAT-SPEC-002 interval evidence
        run: python scripts/build_mat_spec_002.py --out dist/mat-spec-002
      - name: Print MAT-SPEC-002 digests for MAT-SPEC-003 parent pinning
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          for path in sorted(Path("dist/mat-spec-002").iterdir()):
              if path.is_file():
                  print("MAT_SPEC_002_DIGEST", path.name, hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Build MAT-SPEC-003 physical-mode evidence
        run: python scripts/build_mat_spec_003.py --out dist/mat-spec-003
      - name: Print MAT-SPEC-003 eight-file baseline digest inventory
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          for path in sorted(Path("dist/mat-spec-003").iterdir()):
              if path.is_file():
                  print(
                      "MAT_SPEC_003_DIGEST",
                      path.name,
                      hashlib.sha256(path.read_bytes()).hexdigest(),
                  )
          PY
      - name: Build MAT-SPEC-004 temperature preservation evidence
        run: python scripts/build_mat_spec_004.py --out dist/mat-spec-004
      - name: Print MAT-SPEC-004 baseline hashes for MAT-SPEC-005 pinning
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          for path in sorted(Path("dist/mat-spec-004").iterdir()):
              if path.is_file():
                  print(
                      "MAT_SPEC_004_DIGEST",
                      path.name, hashlib.sha256(path.read_bytes()).hexdigest(),
                  )
          PY
      - name: Build MAT-SPEC-005 cross-transition evidence
        run: python scripts/build_mat_spec_005.py --out dist/mat-spec-005
      - name: Print MAT-SPEC-005 ancestor output SHA-256 inventory
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          for file in sorted(Path("dist/mat-spec-005").iterdir()):
              if file.is_file():
                  print(
                      "MAT_SPEC_005_DIGEST", file.name,
                      hashlib.sha256(file.read_bytes()).hexdigest(),
                  )
          PY
      - name: Build MAT-SPEC-006 primary experiment evidence
        run: python scripts/build_mat_spec_006.py --out dist/mat-spec-006
      - name: Print MAT-SPEC-006 seven-artifact baseline for successor
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in sorted(Path("dist/mat-spec-006").iterdir()):
              if path.is_file():
                  print(
                      "MAT_SPEC_006_DIGEST", path.name,
                      hashlib.sha256(path.read_bytes()).hexdigest(),
                  )
          PY
      - name: Build MAT-SPEC-007 independent fit concordance
        run: python scripts/build_mat_spec_007.py --out dist/mat-spec-007
      - name: Capture immutable MAT-SPEC-007 output digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in sorted(Path("dist/mat-spec-007").iterdir()):
              if path.is_file():
                  print(
                      "MAT_SPEC_007_DIGEST", path.name,
                      hashlib.sha256(path.read_bytes()).hexdigest(),
                  )
          PY
      - name: Print MAT-SPEC-008 candidate source file SHA-256
        run: |
          sha256sum data/materials/helium4/mat_spec_008_source_catalogue.json
      - name: Build MAT-SPEC-008 source admission and identity evidence
        run: python scripts/build_mat_spec_008.py --out dist/mat-spec-008
      - name: Capture eight MAT-SPEC-008 parent artifact digests
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for path in sorted(Path("dist/mat-spec-008").iterdir()):
              if path.is_file():
                  print(
                      "MAT_SPEC_008_DIGEST", path.name,
                      hashlib.sha256(path.read_bytes()).hexdigest(),
                  )
          PY
      - name: Build MAT-SPEC-009 prospective blocked challenge
        run: python scripts/build_mat_spec_009.py --out dist/mat-spec-009
      - name: Assert synthetic controls and scientific hold are reported
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path("dist/mat-spec-009")
          split = json.loads((root / "split-protocol.json").read_bytes())
          audit = json.loads((root / "audit.json").read_bytes())
          receiver = json.loads((root / "receiver-gate.json").read_bytes())
          controls = list(csv.DictReader(
              (root / "synthetic-controls.csv").open(newline="")
          ))
          assert len(controls) == 14
          assert all(row["result"] == "PASS_REJECTED" for row in controls)
          assert split["classifier_trained"] is False
          assert split["holdout_accuracy"] is None
          assert receiver["physical_performance"] is None
          print("MAT_SPEC_009_SOURCE_HOLD", split["status"])
          print(
              "MAT_SPEC_009_NEGATIVE_CONTROLS",
              audit["synthetic_negative_controls_passed"],
          )
          PY
      - name: Report MAT-SPEC-008 actual admission and independence audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("dist/mat-spec-008")
          for name in ("measurement-audit.json", "admission.json"):
              data = json.loads((out / name).read_bytes())
              print("MAT_SPEC_008_RECEIPT", name, json.dumps(data, sort_keys=True))
          PY
      - name: Print MAT-SPEC-007 interval and receiver summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("dist/mat-spec-007")
          for name in ("audit.json", "replication-gate.json", "receiver.json"):
              data = json.loads((root / name).read_bytes())
              print("MAT_SPEC_007_RESULT", name, json.dumps(data, sort_keys=True))
          PY
      - name: Print MAT-SPEC-006 source and held-out status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/mat-spec-006")
          gate = json.loads((root / "phase-gate.json").read_bytes())
          audit = json.loads((root / "source-audit.json").read_bytes())
          print("MAT_SPEC_006_SOURCE", json.dumps(audit["numeric"], sort_keys=True))
          print("MAT_SPEC_006_PHASE_GATE", json.dumps(gate, sort_keys=True))
          PY
      - name: Report cross-transition evidence and blocked phase witness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/mat-spec-005")
          audit = json.loads((root / "audit.json").read_bytes())
          gate = json.loads((root / "phase-gate.json").read_bytes())
          crossing = json.loads((root / "crossing.json").read_bytes())
          print(
              "MAT_SPEC_005_CHANNELS",
              json.dumps(audit["source_property_counts"], sort_keys=True),
          )
          print("MAT_SPEC_005_CROSSING", json.dumps(crossing, sort_keys=True))
          print("MAT_SPEC_005_GATE", json.dumps(gate, sort_keys=True))
          PY
      - name: Audit MAT-SPEC-004 symbolic losses and phase hold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/mat-spec-004")
          audit = json.loads((root / "audit.json").read_text())
          gate = json.loads((root / "phase-gate.json").read_text())
          print(
              "MAT_SPEC_004_NUMERIC_RECEIPT",
              json.dumps({
                  "samples": audit["source_entries"],
                  "closure": audit["exact_mass_fraction_closure_checks"],
                  "full_precision_distinct": audit["full_precision_fraction_values_distinct"],
                  "midi_distinct": audit["quantized_midi_unique_notes"],
                  "midi_collisions": audit["quantized_midi_colliding_pairs"],
              }, sort_keys=True),
          )
          print("MAT_SPEC_004_PHASE_GATE", gate["status"])
          print("MAT_SPEC_004_BLOCK_REASONS", ",".join(gate["reasons"]))
          PY
      - name: Report measured finite-window mode diagnostics
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("dist/mat-spec-003")
          controls = json.loads((root / "controls.json").read_text())
          print(
              "MAT_SPEC_003_INTERVAL_COUNTS",
              json.dumps(controls["pressure_pair_interval_counts"], sort_keys=True),
          )
          print(
              "MAT_SPEC_003_RECEIVER_COLLISIONS",
              json.dumps(controls["receiver"]["collision_audit"], sort_keys=True),
          )
          print(
              "MAT_SPEC_003_COVERAGE_CORE_COUNTS",
              json.dumps(controls["coverage_core_interval_counts"], sort_keys=True),
          )
          print(
              "MAT_SPEC_003_COVERAGE_CORE_RECEIVERS",
              json.dumps(
                  controls["coverage_core_receiver"]["collision_audit"], sort_keys=True
              ),
          )
          for row in csv.DictReader((root / "core-discrimination.csv").open(newline="")):
              if row["mode"] == "roton" and row["comparison"] == "overlap":
                  print(
                      "MAT_SPEC_003_ROTON_CORE_OVERLAP",
                      row["pressure_a_bar"], row["pressure_b_bar"],
                  )
          for row in csv.DictReader((root / "features.csv").open(newline="")):
              print(
                  "MAT_SPEC_003_MODE",
                  row["pressure_bar"], row["mode"], row["status"],
                  row["nominal"], row["lower"], row["upper"],
                  row["nominal_q_inverse_angstrom"], row["candidate_q_count"],
              )
          PY
      - name: Diagnose measured roton missingness without inferring absent values
        run: |
          python - <<'PY'
          from fractions import Fraction
          from pathlib import Path

          from materials import mat_spec
          from materials.mat_spec_002 import index_observations

          root = Path("data/materials/helium4/DispersionAllPressures.txt")
          by = index_observations(mat_spec.parse_helium(mat_spec.read_regular(root)))
          for pressure in mat_spec.PRESSURES:
              missing = [
                  r["q_inverse_angstrom"]
                  for r in by[pressure]
                  if Fraction("1.600") <= Fraction(r["q_inverse_angstrom"]) <= Fraction("2.150")
                  and r["status"] == "missing"
              ]
              print(
                  "MAT_SPEC_003_ROTON_MISSING",
                  pressure, len(missing), missing[:8], missing[-8:],
              )
          contiguous = []
          for i, r in enumerate(by[mat_spec.PRESSURES[0]]):
              q = Fraction(r["q_inverse_angstrom"])
              if Fraction("1.600") <= q <= Fraction("2.150") and all(
                  by[p][i]["status"] == "tabulated" for p in mat_spec.PRESSURES
              ):
                  contiguous.append(r["q_inverse_angstrom"])
          runs = []
          for q in contiguous:
              if not runs or Fraction(q) - Fraction(runs[-1][-1]) != Fraction("0.002"):
                  runs.append([q])
              else:
                  runs[-1].append(q)
          print(
              "MAT_SPEC_003_ALL_PRESSURE_COMPLETE_RUNS",
              [(run[0], run[-1], len(run)) for run in runs if len(run) >= 5],
          )
          PY

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest
      - run: python -m ruff check .

  etq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - run: npm run verify

  browser-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check browser JavaScript syntax
        run: find APP -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node APP/tests/run.cjs
      - run: node APP/tests/dom-smoke.cjs
