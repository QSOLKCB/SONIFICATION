name: SPARK-001 GNATprove proof obligations
on:
  pull_request:
    paths:
      - 'verification/spark/**'
      - '.github/workflows/spark-001-proof.yml'
  push:
    paths:
      - 'verification/spark/**'
      - '.github/workflows/spark-001-proof.yml'
permissions:
  contents: read
jobs:
  gnatprove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Alire 2.1.1
        uses: alire-project/setup-alire@v6
        with:
          version: '2.1.1'
      - name: Install matching pinned GNAT/GPRbuild/GNATprove
        shell: bash
        run: |
          set -euo pipefail
          alr --version
          alr -n install --prefix="$RUNNER_TEMP/spark-compiler" \
            gnat_native=16.1.0 gprbuild=26.0.1 gnatprove=16.1.0
          echo "$RUNNER_TEMP/spark-compiler/bin" >> "$GITHUB_PATH"
      - name: Execute proof obligations on checked-out SPARK source
        shell: bash
        run: |
          set -euo pipefail
          gnatprove --version
          command -v gnatprove
          mkdir -p verification/spark/obj
          sha256sum verification/spark/spark_core.ads \
            verification/spark/spark_core.adb \
            verification/spark/spark_core.gpr | tee spark-source-hashes.txt
          gnatprove -P verification/spark/spark_core.gpr \
            --mode=all --level=2 2>&1 | tee spark-proof.txt
      - name: Save executed proof log regardless of success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-001-gnatprove-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spark-source-hashes.txt
            spark-proof.txt
          if-no-files-found: warn
          retention-days: 30
